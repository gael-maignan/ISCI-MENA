<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Header institutionnel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Roboto", sans-serif;
      background: #eee;
      color: #111;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .header {
      height: 124px;
      display: flex;
      align-items: stretch;
      position: relative;
      z-index: 100;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }


    /* =========================================================
       LOGOS DES INSTITUTIONS
       ========================================================= */

    .institutions {
      display: flex;
      align-items: flex-start;
      flex-shrink: 0;

      position: relative;
      z-index: 10;

      margin-left: max(40px, calc((100vw - 1200px) / 2));
    }

    .institution {
      width: 124px;
      height: 124px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      position: relative;
    }

    .institution-1 {
      width: 164px;
      height: 164px;
    }

    .institution-logo {
      display: block;

      width: 78%;
      height: 78%;

      max-width: 110px;
      max-height: 110px;

      object-fit: contain;
      object-position: center;
    }

    .institution-1 .institution-logo {
      width: 76%;
      height: 76%;

      max-width: 130px;
      max-height: 130px;
    }


    /* =========================================================
       CONTENU DU HEADER
       ========================================================= */

    .header-content {
      flex: 1;
      min-width: 0;

      display: flex;
      flex-direction: column;

      padding: 0 max(40px, calc((100vw - 1200px) / 2));
    }


    /* =========================================================
       NAVIGATION SUPÉRIEURE
       ========================================================= */

    .top-nav {
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      color: #666;
      font-size: 14px;
    }

    .top-nav a {
      padding: 0 14px;

      color: #666;
      text-decoration: none;
      white-space: nowrap;

      border-right: 1px solid #aaa;
    }

    .top-nav a:last-child {
      padding-right: 0;
      border-right: none;
    }

    .top-nav a:hover {
      color: #111;
    }


    /* =========================================================
       NAVIGATION PRINCIPALE
       ========================================================= */

    .main-nav {
      height: 74px;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: clamp(18px, 2.4vw, 42px);

      /*
       * IMPORTANT :
       * Le menu déroulant est positionné par rapport au HEADER,
       * pas par rapport à .main-nav.
       */
      position: static;
    }

    .nav-item {
      position: static;

      display: flex;
      align-items: center;

      height: 100%;
    }

    .nav-link {
      position: relative;

      display: inline-flex;
      align-items: center;

      height: 100%;

      color: #111;
      font-size: 18px;
      font-weight: 700;

      text-decoration: none;
      white-space: nowrap;
    }

    .nav-link:hover {
      color: #00a9dc;
    }


    /* =========================================================
       PETIT TRIANGLE SOUS LE LIEN
       ========================================================= */

    .nav-link::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 0;
      height: 0;

      transform: translateX(-50%) translateY(1px);

      border-left: 11px solid transparent;
      border-right: 11px solid transparent;

      border-bottom: 11px solid #06add5;

      opacity: 0;
    }

    .nav-item:hover .nav-link,
    .nav-item:focus-within .nav-link {
      color: #00a9dc;
    }

    .nav-item:hover .nav-link::after,
    .nav-item:focus-within .nav-link::after {
      opacity: 1;
    }


    /* =========================================================
       MÉGA MENU
       ========================================================= */

    .mega-menu {
      position: absolute;

      /*
       * Le .header est position: relative.
       * Le menu est donc positionné par rapport au header.
       *
       * 100% = exactement sous le header.
       */
      top: 100%;
      left: 0;

      z-index: 1000;

      width: 100vw;
      min-height: 190px;

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      padding: 20px max(40px, calc((100vw - 1000px) / 2));

      background: #06add5;

      /*
       * Pas d'animation.
       */
      visibility: hidden;
      opacity: 0;
      pointer-events: none;

      transform: none;
      transition: none;
    }

    .nav-item:hover .mega-menu,
    .nav-item:focus-within .mega-menu {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;

      transform: none;
    }


    /* =========================================================
       COLONNES DU MÉGA MENU
       ========================================================= */

    .mega-column {
      min-width: 0;

      padding: 0 44px;

      border-right: 1px solid rgba(255, 255, 255, 0.35);
    }

    .mega-column:first-child {
      padding-left: 0;
    }

    .mega-column:last-child {
      padding-right: 0;
      border-right: 0;
    }

    .mega-menu a {
      display: block;

      margin: 0 0 14px;

      color: #fff;

      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;

      text-decoration: none;
    }

    .mega-menu a:last-child {
      margin-bottom: 0;
    }

    .mega-menu a:hover,
    .mega-menu a:focus {
      color: #111;
    }


    /* =========================================================
       BOUTON AGENDA
       ========================================================= */

    .donate {
      font-weight: 700;
      margin-left: -5px;

      padding: 11px 21px;

      background: #ffbe00;
      color: #111 !important;

      text-decoration: none;
    }

    .donate:hover {
      background: #e8aa00;
    }

    .main-nav > .donate {
      height: auto;
    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      height: 500px;

      background:
        linear-gradient(
          rgba(40, 45, 48, 0.35),
          rgba(40, 45, 48, 0.35)
        ),
        url("https://unhabitat.org/sites/default/files/styles/featured_image_header_xl_focal/public/2026/05/Report_CoverImage_0.jpg.webp?itok=LGzE99AL")
        center / cover;
    }


    /* =========================================================
       RESPONSIVE : 1400px
       ========================================================= */

    @media (max-width: 1400px) {

      .institutions {
        margin-left: 40px;
      }

      .header-content {
        padding-left: 30px;
        padding-right: 40px;
      }

      .main-nav {
        gap: 24px;
      }

      .main-nav a {
        font-size: 16px;
      }
    }


    /* =========================================================
       RESPONSIVE : 1100px
       ========================================================= */

    @media (max-width: 1100px) {

      .header {
        height: 110px;
      }

      .institution {
        width: 110px;
        height: 110px;
      }

      .institution-1 {
        width: 140px;
        height: 140px;
      }

      .institution-logo {
        max-width: 90px;
        max-height: 90px;
      }

      .institution-1 .institution-logo {
        max-width: 110px;
        max-height: 110px;
      }

      .header-content {
        padding: 0 24px;
      }

      .top-nav {
        font-size: 12px;
      }

      .top-nav a {
        padding: 0 8px;
      }

      .main-nav {
        gap: 16px;
      }

      .main-nav a,
      .nav-link {
        font-size: 14px;
      }

      .mega-menu {
        padding: 18px 30px;
      }

      .mega-menu a {
        font-size: 15px;
      }

      .mega-column {
        padding: 0 25px;
      }
    }


    /* =========================================================
       RESPONSIVE : 850px
       ========================================================= */

    @media (max-width: 850px) {

      .header {
        height: auto;
        flex-wrap: wrap;
      }

      .institutions {
        margin-left: 20px;
      }

      .institution {
        width: 88px;
        height: 90px;
      }

      .institution-1 {
        width: 120px;
        height: 120px;
      }

      .institution-logo {
        width: 78%;
        height: 78%;

        max-width: 72px;
        max-height: 72px;
      }

      .institution-1 .institution-logo {
        max-width: 92px;
        max-height: 92px;
      }

      .header-content {
        width: 100%;
        flex-basis: 100%;

        padding: 0 20px;
      }

      .top-nav {
        display: none;
      }

      .main-nav {
        min-height: 70px;
        height: auto;

        justify-content: center;

        flex-wrap: wrap;

        gap: 14px 22px;

        padding: 15px 0;
      }

      .nav-item {
        height: auto;
      }

      .nav-link {
        height: 40px;
      }

      /*
       * Sur mobile, le triangle est supprimé.
       */
      .nav-link::after {
        display: none;
      }

      /*
       * Menu mobile.
       */
      .mega-menu {
        position: fixed;

        top: auto;
        bottom: auto;

        left: 0;

        width: 100%;

        max-height: 60vh;

        overflow-y: auto;

        grid-template-columns: 1fr;

        gap: 18px;

        padding: 20px;

        /*
         * Toujours aucune animation.
         */
        transform: none;
        transition: none;
      }

      .mega-column,
      .mega-column:first-child,
      .mega-column:last-child {
        padding: 0 0 16px;

        border-right: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      }

      .mega-column:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .mega-menu a {
        margin-bottom: 10px;
        font-size: 15px;
      }
    }


    /* =========================================================
       RESPONSIVE : 600px
       ========================================================= */

    @media (max-width: 600px) {

      .header {
        display: block;
      }

      .institutions {
        width: 100%;

        margin: 0;

        display: grid;

        grid-template-columns:
          1.35fr
          repeat(3, 1fr);
      }

      .institution,
      .institution-1 {
        width: 100%;
        height: 88px;
      }

      .institution-1 {
        height: 112px;
      }

      .institution-logo,
      .institution-1 .institution-logo {
        width: 78%;
        height: 78%;

        max-width: 70px;
        max-height: 70px;
      }

      .institution-1 .institution-logo {
        max-width: 88px;
        max-height: 88px;
      }

      .header-content {
        padding: 0 15px;
      }

      .main-nav {
        gap: 12px 18px;
        padding: 18px 0;
      }

      .main-nav a,
      .nav-link {
        font-size: 13px;
      }

      .donate {
        padding: 9px 16px;
      }

      .mega-menu {
        padding: 18px 15px;
      }

      .hero {
        height: 200px;
      }
    }


    /* =========================================================
       RESPONSIVE : 400px
       ========================================================= */

    @media (max-width: 400px) {

      .institution,
      .institution-1 {
        height: 78px;
      }

      .institution-1 {
        height: 100px;
      }

      .institution-logo,
      .institution-1 .institution-logo {
        max-width: 58px;
        max-height: 58px;
      }

      .institution-1 .institution-logo {
        max-width: 76px;
        max-height: 76px;
      }

      .main-nav {
        gap: 10px 14px;
      }

      .main-nav a,
      .nav-link {
        font-size: 12px;
      }
    }

  </style>
</head>


<body>

  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header class="header">

    <!-- =====================================================
         LOGOS
         ===================================================== -->

    <div
      class="institutions"
      aria-label="Institutions partenaires"
    >

      <div class="institution institution-1">
        <img
          class="institution-logo"
          src="images/logo.png"
          alt="UN-Habitat"
        >
      </div>

      <div class="institution institution-2">
        <img
          class="institution-logo"
          src="https://isci-mena.univ-gustave-eiffel.fr/fileadmin/satellite/_img/logo_univ_gustave_eiffel_3lignes_rvb.svg"
          alt="Logo de l'institution 2"
        >
      </div>

      <div class="institution institution-3">
        <img
          class="institution-logo"
          src="images/eivp.png"
          alt="Logo de l'institution 3"
        >
      </div>

      <div class="institution institution-4">
        <img
          class="institution-logo"
          src="images/UN-Habitat.png"
          alt="Logo de l'institution 4"
        >
      </div>

    </div>


    <!-- =====================================================
         CONTENU
         ===================================================== -->

    <div class="header-content">

      <!-- Navigation supérieure -->

      <nav class="top-nav">

        <a href="#">PROGRAMMES</a>
        <a href="#">MEDIA CENTRE</a>
        <a href="#">GET INVOLVED</a>
        <a href="#">EVENTS</a>

      </nav>


      <!-- ===================================================
           NAVIGATION PRINCIPALE
           =================================================== -->

      <nav
        class="main-nav"
        aria-label="Navigation principale"
      >

        <!-- =================================================
             À PROPOS
             ================================================= -->

        <div class="nav-item">

          <a
            href="#"
            class="nav-link"
          >
            À PROPOS
          </a>

          <div
            class="mega-menu"
            aria-label="Sous-menu À propos"
          >

            <div class="mega-column">

<a href="">La Chaire</a>
<a href="">Membres & partenaires</a>
<a href="">Méthode</a>
<a href="">Gouvernance</a>






            </div>


          </div>

        </div>


        <!-- =================================================
             PROJETS
             ================================================= -->

        <div class="nav-item">

          <a
            href="#"
            class="nav-link"
          >
            PROJETS
          </a>

          <div
            class="mega-menu"
            aria-label="Sous-menu Projets"
          >

            <div class="mega-column">

              <a href="#">Nos projets</a>
              <a href="#">Projets en cours</a>

            </div>


          </div>

        </div>


        <!-- =================================================
             ÉVÈNEMENTS
             ================================================= -->

        <div class="nav-item">

          <a
            href="#"
            class="nav-link"
          >
            ÉVÈNEMENTS
          </a>

          <div
            class="mega-menu"
            aria-label="Sous-menu Évènements"
          >

            <div class="mega-column">

              <a href="#">Agenda</a>
              <a href="#">Évènements à venir</a>

            </div>


          </div>

        </div>


        <!-- =================================================
             PUBLICATIONS
             ================================================= -->

        <div class="nav-item">

          <a
            href="#"
            class="nav-link"
          >
            PUBLICATIONS
          </a>

          <div
            class="mega-menu"
            aria-label="Sous-menu Publications"
          >

            <div class="mega-column">

              <a href="#">Rapports</a>
              <a href="#">Études</a>

            </div>


          </div>

        </div>


        <!-- =================================================
             AGENDA
             ================================================= -->

        <a
          href="#"
          class="donate"
        >
          AGENDA
        </a>

      </nav>

    </div>

  </header>


  <!-- =======================================================
       HERO
       ======================================================= -->

  <section class="hero"></section>

</body>
</html>
