<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Header institutionnel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Roboto", sans-serif;
      background: #eee;
      color: #111;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .header {
      height: 124px;
      display: flex;
      align-items: stretch;
      position: relative;
      z-index: 100;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }


    /* =========================================================
       LOGOS DES INSTITUTIONS
       ========================================================= */

    .institutions {
      display: flex;
      align-items: flex-start;
      flex-shrink: 0;

      position: relative;
      z-index: 10;

      margin-left: max(40px, calc((100vw - 1200px) / 2));
    }

    .institution {
      width: 124px;
      height: 124px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      position: relative;
    }

    .institution-1 {
      width: 164px;
      height: 164px;
    }




    .institution-logo {
      display: block;

      width: 78%;
      height: 78%;

      max-width: 110px;
      max-height: 110px;

      object-fit: contain;
      object-position: center;
    }

    .institution-1 .institution-logo {
      width: 76%;
      height: 76%;

      max-width: 130px;
      max-height: 130px;
    }


    /* =========================================================
       CONTENU DU HEADER
       ========================================================= */

    .header-content {
      flex: 1;
      min-width: 0;

      display: flex;
      flex-direction: column;

      padding: 0 max(40px, calc((100vw - 1200px) / 2));
    }


    /* =========================================================
       NAVIGATION SUPÉRIEURE
       ========================================================= */

    .top-nav {
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      color: #666;
      font-size: 13px;
    }

    .top-nav a {
      padding: 0 14px;

      color: #666;
      text-decoration: none;
      white-space: nowrap;

      border-right: 1px solid #aaa;
    }

    .top-nav a:last-child {
      padding-right: 0;
      border-right: none;
    }

    .top-nav a:hover {
      color: #111;
    }


    /* =========================================================
       NAVIGATION PRINCIPALE
       ========================================================= */

    .main-nav {
      height: 74px;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: 0;

      /*
       * IMPORTANT :
       * Le menu déroulant est positionné par rapport au HEADER,
       * pas par rapport à .main-nav.
       */
      position: static;
    }

    .nav-item {
      position: static;

      display: flex;
      align-items: center;

      height: 100%;
    }

    .nav-link {
      position: relative;

      display: inline-flex;
      align-items: center;

      height: 100%;
      padding: 0 clamp(10px, 1.2vw, 21px);

      color: #111;
      font-size: 17px;
      font-weight: 700;

      text-decoration: none;
      white-space: nowrap;
    }

    .nav-link:hover {
      color: #00a9dc;
    }


    /* =========================================================
       PETIT TRIANGLE SOUS LE LIEN
       ========================================================= */

    .nav-link::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 0;
      height: 0;

      transform: translateX(-50%) translateY(1px);

      border-left: 11px solid transparent;
      border-right: 11px solid transparent;

      border-bottom: 11px solid #06add5;

      opacity: 0;
    }

    .nav-item:hover .nav-link,
    .nav-item:focus-within .nav-link {
      color: #00a9dc;
    }

    .nav-item:hover .nav-link::after,
    .nav-item:focus-within .nav-link::after {
      opacity: 1;
    }


    /* =========================================================
       MÉGA MENU
       ========================================================= */

    .mega-menu {
      position: absolute;

      /*
       * Le .header est position: relative.
       * Le menu est donc positionné par rapport au header.
       *
       * 100% = exactement sous le header.
       */
      top: 100%;
      left: 0;

      z-index: 1000;

      width: 100vw;
      min-height: 190px;

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      padding: 20px max(40px, calc((100vw - 1000px) / 2));

      background: #06add5;

      /*
       * Pas d'animation.
       */
      visibility: hidden;
      opacity: 0;
      pointer-events: none;

      transform: none;
      transition: none;
    }

    .nav-item:hover .mega-menu,
    .nav-item:focus-within .mega-menu {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;

      transform: none;
    }


    /* =========================================================
       COLONNES DU MÉGA MENU
       ========================================================= */

    .mega-column {
      min-width: 0;

      padding: 0 44px;

      border-right: 1px solid rgba(255, 255, 255, 0.35);
    }

    .mega-column:first-child {
      padding-left: 0;
    }

    .mega-column:last-child {
      padding-right: 0;
      border-right: 0;
    }

    .mega-menu a {
      display: block;

      margin: 0 0 14px;

      color: #fff;

      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;

      text-decoration: none;
    }

    .mega-menu a:last-child {
      margin-bottom: 0;
    }

    .mega-menu a:hover,
    .mega-menu a:focus {
      color: #111;
    }


    /* =========================================================
       BOUTON AGENDA
       ========================================================= */

    .donate {
      font-weight: 700;
      margin-left: 0;

      padding: 11px 21px;

      background: #ffbe00;
      color: #111 !important;

      text-decoration: none;
    }

    .donate:hover {
      background: #e8aa00;
    }

    .main-nav > .donate {
      height: auto;
    }


    /* =========================================================
       HERO / CARROUSEL D'ACTUALITÉS
       ========================================================= */

    .hero {
      position: relative;
      height: 500px;
      overflow: hidden;
      background: #282d30;
    }

    .hero-slide {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: flex-end;

      background:
        linear-gradient(
          to top,
          rgba(20, 22, 24, 0.85) 0%,
          rgba(20, 22, 24, 0.35) 45%,
          rgba(20, 22, 24, 0.15) 100%
        ),
        var(--slide-image) center / cover no-repeat;

      opacity: 0;
      visibility: hidden;
      transition: opacity 0.7s ease;
      z-index: 1;
    }

    .hero-slide.is-active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    .hero-slide-content {
      max-width: 720px;

      padding: 0 max(40px, calc((100vw - 1200px) / 2)) 56px;

      color: #fff;
    }

    .hero-eyebrow {
      display: inline-block;

      margin-bottom: 14px;

      padding: 5px 12px;

      background: #00a9dc;
      color: #fff;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hero-title {
      margin-bottom: 14px;

      font-size: 34px;
      font-weight: 700;
      line-height: 1.2;
    }

    .hero-description {
      margin-bottom: 22px;

      max-width: 620px;

      font-size: 16px;
      font-weight: 300;
      line-height: 1.5;

      color: rgba(255, 255, 255, 0.9);
    }

    .hero-link {
      display: inline-block;

      padding: 11px 22px;

      background: #ffbe00;
      color: #111;

      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;

      text-decoration: none;
    }

    .hero-link:hover {
      background: #e8aa00;
    }


    /* --------- Flèches --------- */

    .hero-arrow {
      position: absolute;
      top: 50%;
      z-index: 5;

      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      transform: translateY(-50%);

      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      border: none;

      font-size: 20px;
      line-height: 1;
      cursor: pointer;

      transition: background 0.2s ease;
    }

    .hero-arrow:hover {
      background: #00a9dc;
    }

    .hero-arrow--prev {
      left: 20px;
    }

    .hero-arrow--next {
      right: 20px;
    }


    /* --------- Pastilles --------- */

    .hero-dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 20px;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .hero-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;

      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: transparent;

      cursor: pointer;
    }

    .hero-dot.is-active {
      background: #ffbe00;
      border-color: #ffbe00;
    }


    /* --------- Responsive --------- */

    @media (max-width: 850px) {

      .hero {
        height: 420px;
      }

      .hero-title {
        font-size: 26px;
      }

      .hero-description {
        font-size: 14px;
      }
    }

    @media (max-width: 600px) {

      .hero-slide-content {
        padding: 0 20px 40px;
      }

      .hero-title {
        font-size: 20px;
      }

      .hero-description {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .hero-arrow {
        width: 34px;
        height: 34px;
        font-size: 16px;
      }
    }


    /* =========================================================
       RESPONSIVE : 1400px
       ========================================================= */

    @media (max-width: 1400px) {

      .institutions {
        margin-left: 40px;
      }

      .header-content {
        padding-left: 30px;
        padding-right: 40px;
      }

      .main-nav {
        gap: 0;
      }

      .main-nav a {
        font-size: 16px;
      }
    }


    /* =========================================================
       RESPONSIVE : 1100px
       ========================================================= */

    @media (max-width: 1100px) {

      .header {
        height: 110px;
      }

      .institution {
        width: 110px;
        height: 110px;
      }

      .institution-1 {
        width: 140px;
        height: 140px;
      }

      .institution-logo {
        max-width: 90px;
        max-height: 90px;
      }

      .institution-1 .institution-logo {
        max-width: 110px;
        max-height: 110px;
      }

      .header-content {
        padding: 0 24px;
      }

      .top-nav {
        font-size: 12px;
      }

      .top-nav a {
        padding: 0 8px;
      }

      .main-nav {
        gap: 0;
      }

      .main-nav a,
      .nav-link {
        font-size: 14px;
      }

      .mega-menu {
        padding: 18px 30px;
      }

      .mega-menu a {
        font-size: 15px;
      }

      .mega-column {
        padding: 0 25px;
      }
    }


    /* =========================================================
       RESPONSIVE : 850px
       ========================================================= */

    @media (max-width: 850px) {

      .header {
        height: auto;
        flex-wrap: wrap;
      }

      .institutions {
        margin-left: 20px;
      }

      .institution {
        width: 88px;
        height: 90px;
      }

      .institution-1 {
        width: 120px;
        height: 120px;
      }

      .institution-logo {
        width: 78%;
        height: 78%;

        max-width: 72px;
        max-height: 72px;
      }

      .institution-1 .institution-logo {
        max-width: 92px;
        max-height: 92px;
      }

      .header-content {
        width: 100%;
        flex-basis: 100%;

        padding: 0 20px;
      }

      .top-nav {
        display: none;
      }

      .main-nav {
        min-height: 70px;
        height: auto;

        justify-content: center;

        flex-wrap: wrap;

        gap: 0;

        padding: 15px 0;
      }

      .nav-item {
        height: auto;
      }

      .nav-link {
        height: 40px;
      }

      /*
       * Sur mobile, le triangle est supprimé.
       */
      .nav-link::after {
        display: none;
      }

      /*
       * Menu mobile.
       */
      .mega-menu {
        position: fixed;

        top: auto;
        bottom: auto;

        left: 0;

        width: 100%;

        max-height: 60vh;

        overflow-y: auto;

        grid-template-columns: 1fr;

        gap: 18px;

        padding: 20px;

        /*
         * Toujours aucune animation.
         */
        transform: none;
        transition: none;
      }

      .mega-column,
      .mega-column:first-child,
      .mega-column:last-child {
        padding: 0 0 16px;

        border-right: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      }

      .mega-column:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .mega-menu a {
        margin-bottom: 10px;
        font-size: 15px;
      }
    }


    /* =========================================================
       RESPONSIVE : 600px
       ========================================================= */

    @media (max-width: 600px) {

      .header {
        display: block;
      }

      .institutions {
        width: 100%;

        margin: 0;

        display: grid;

        grid-template-columns:
          1.35fr
          repeat(3, 1fr);
      }

      .institution,
      .institution-1 {
        width: 100%;
        height: 88px;
      }

      .institution-1 {
        height: 112px;
      }

      .institution-logo,
      .institution-1 .institution-logo {
        width: 78%;
        height: 78%;

        max-width: 70px;
        max-height: 70px;
      }

      .institution-1 .institution-logo {
        max-width: 88px;
        max-height: 88px;
      }

      .header-content {
        padding: 0 15px;
      }

      .main-nav {
        gap: 0;
        padding: 18px 0;
      }

      .main-nav a,
      .nav-link {
        font-size: 13px;
      }

      .nav-link {
        padding-left: 9px;
        padding-right: 9px;
      }

      .donate {
        padding: 9px 16px;
      }

      .mega-menu {
        padding: 18px 15px;
      }

      .hero {
        height: 200px;
      }
    }


    /* =========================================================
       RESPONSIVE : 400px
       ========================================================= */

    @media (max-width: 400px) {

      .institution,
      .institution-1 {
        height: 78px;
      }

      .institution-1 {
        height: 100px;
      }

      .institution-logo,
      .institution-1 .institution-logo {
        max-width: 58px;
        max-height: 58px;
      }

      .institution-1 .institution-logo {
        max-width: 76px;
        max-height: 76px;
      }

      .main-nav {
        gap: 0;
      }

      .main-nav a,
      .nav-link {
        font-size: 12px;
      }
    }

  </style>
</head>


<body>

  <!-- =======================================================

  <!-- =======================================================
       HERO / CARROUSEL D'ACTUALITÉS
       ======================================================= -->

  <section
    class="hero"
    aria-label="Dernières actualités"
  >

    <button
      class="hero-arrow hero-arrow--prev"
      type="button"
      aria-label="Actualité précédente"
    >&#10094;</button>

    <button
      class="hero-arrow hero-arrow--next"
      type="button"
      aria-label="Actualité suivante"
    >&#10095;</button>

    <div class="hero-dots" role="tablist" aria-label="Choisir une actualité"></div>

  </section>

  <script>
    (function () {

      /*
       * =====================================================
       * DONNÉES DES ACTUALITÉS
       * (à remplacer par vos propres actualités / images)
       * =====================================================
       */

      const slides = [
        {
          image: "https://unhabitat.org/sites/default/files/styles/featured_image_header_xl_focal/public/2026/05/Report_CoverImage_0.jpg.webp?itok=LGzE99AL",
          eyebrow: "Rapport",
          title: "Publication du dernier rapport annuel",
          description: "Découvrez les principaux enseignements et recommandations issus de notre dernière étude sur le développement urbain durable.",
          link: "#"
        },
        {
          image: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=1600&auto=format&fit=crop",
          eyebrow: "Évènement",
          title: "Conférence internationale sur les villes durables",
          description: "Retrouvez les temps forts de notre conférence qui a réuni chercheurs, institutions et acteurs de terrain autour des enjeux urbains.",
          link: "#"
        },
        {
          image: "https://images.unsplash.com/photo-1444723121867-7a241cacace9?q=80&w=1600&auto=format&fit=crop",
          eyebrow: "Projet",
          title: "Lancement d'un nouveau projet de recherche",
          description: "Un nouveau projet vient de démarrer pour étudier l'impact des politiques publiques sur la résilience des territoires.",
          link: "#"
        },
        {
          image: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?q=80&w=1600&auto=format&fit=crop",
          eyebrow: "Publication",
          title: "Nouvelle étude sur la mobilité urbaine",
          description: "Une analyse approfondie des pratiques de mobilité dans les grandes métropoles, avec des pistes concrètes pour les décideurs.",
          link: "#"
        }
      ];

      const AUTOPLAY_DELAY = 6000;

      const hero = document.querySelector(".hero");
      const dotsContainer = hero.querySelector(".hero-dots");
      const prevBtn = hero.querySelector(".hero-arrow--prev");
      const nextBtn = hero.querySelector(".hero-arrow--next");

      let current = 0;
      let timer = null;

      /*
       * ---------------------------------------------------
       * Construction des slides et des pastilles
       * ---------------------------------------------------
       */

      slides.forEach((slide, index) => {

        const slideEl = document.createElement("div");
        slideEl.className = "hero-slide";
        slideEl.style.setProperty("--slide-image", `url("${slide.image}")`);
        slideEl.setAttribute("role", "group");
        slideEl.setAttribute("aria-roledescription", "slide");
        slideEl.setAttribute("aria-label", `${index + 1} sur ${slides.length}`);

        slideEl.innerHTML = `
          <div class="hero-slide-content">
            <span class="hero-eyebrow">${slide.eyebrow}</span>
            <h2 class="hero-title">${slide.title}</h2>
            <p class="hero-description">${slide.description}</p>
            <a class="hero-link" href="${slide.link}">En savoir plus</a>
          </div>
        `;

        hero.insertBefore(slideEl, dotsContainer);

        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "hero-dot";
        dot.setAttribute("role", "tab");
        dot.setAttribute("aria-label", `Aller à l'actualité ${index + 1}`);
        dot.addEventListener("click", () => goToSlide(index));

        dotsContainer.appendChild(dot);
      });

      const slideEls = hero.querySelectorAll(".hero-slide");
      const dotEls = dotsContainer.querySelectorAll(".hero-dot");

      /*
       * ---------------------------------------------------
       * Navigation
       * ---------------------------------------------------
       */

      function showSlide(index) {

        slideEls.forEach((el, i) => el.classList.toggle("is-active", i === index));
        dotEls.forEach((el, i) => el.classList.toggle("is-active", i === index));

        current = index;
      }

      function goToSlide(index) {

        const nextIndex = (index + slides.length) % slides.length;
        showSlide(nextIndex);
        restartAutoplay();
      }

      function nextSlide() {
        goToSlide(current + 1);
      }

      function prevSlide() {
        goToSlide(current - 1);
      }

      function startAutoplay() {
        timer = setInterval(nextSlide, AUTOPLAY_DELAY);
      }

      function restartAutoplay() {
        clearInterval(timer);
        startAutoplay();
      }

      prevBtn.addEventListener("click", prevSlide);
      nextBtn.addEventListener("click", nextSlide);

      hero.addEventListener("mouseenter", () => clearInterval(timer));
      hero.addEventListener("mouseleave", startAutoplay);

      showSlide(0);
      startAutoplay();

    })();
  </script>

</body>
</html>
