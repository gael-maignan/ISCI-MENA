<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carte</title>

    <!-- =========================
         POLICE ROBOTO
    ========================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <!-- =========================
         LEAFLET CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        /* =========================
           RESET
        ========================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================
           PAGE
        ========================== */

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
        }


        /* =========================
           CARTE
        ========================== */

        #map {
            width: 100%;
            height: 100vh;
        }


        /* =========================
           POPUP LEAFLET
        ========================== */

        .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
        }

        .leaflet-popup-content {
            width: 290px !important;
            margin: 0;
        }

        .popup {
            background: #ffffff;
        }


        /* Image */

        .popup img {
            display: block;
            width: 100%;
            height: 150px;
            object-fit: cover;
        }


        /* Contenu */

        .popup-content {
            padding: 15px;
        }


        /* Titre */

        .popup h3 {
            margin-bottom: 7px;

            color: #263238;

            font-size: 19px;
            font-weight: 500;
            line-height: 1.3;
        }


        /* Description */

        .popup p {
            margin-bottom: 13px;

            color: #697277;

            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;
        }


        /* Bouton */

        .more-btn {
            display: inline-block;

            padding: 9px 14px;

            background: #9b7653;
            color: #ffffff;

            border-radius: 6px;

            font-size: 13px;
            font-weight: 500;

            text-decoration: none;

            transition: background 0.2s ease;
        }

        .more-btn:hover {
            background: #78583e;
        }

    </style>
</head>


<body>

    <!-- =========================
         CARTE
    ========================== -->

    <div id="map"></div>


    <!-- =========================
         LEAFLET JS
    ========================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        // =========================
        // INITIALISATION
        // =========================

        const map = L.map('map', {
            zoomControl: true
        });


        // =========================
        // FOND DE CARTE
        // =========================

        L.tileLayer(
            'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
            {
                attribution:
                    '&copy; OpenStreetMap contributors, Tiles style by HOT',

                maxZoom: 19
            }
        ).addTo(map);


        // =========================
        // DONNÉES DES LIEUX
        // =========================

        const places = [

            {
                name: "Îles Kerkennah",

                coordinates: [34.715, 11.185],

                image:
                    "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80",

                description:
                    "Un archipel paisible au large de la côte est tunisienne, réputé pour ses paysages marins et son authenticité.",

                link:
                    "https://fr.wikipedia.org/wiki/Kerkennah"
            },

            {
                name: "Médina de Tunis",

                coordinates: [36.7997, 10.1675],

                image:
                    "https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=900&q=80",

                description:
                    "Le centre historique de Tunis, avec ses souks, ses ruelles et son remarquable patrimoine architectural.",

                link:
                    "https://fr.wikipedia.org/wiki/M%C3%A9dina_de_Tunis"
            },

            {
                name: "Béni Khalled",

                coordinates: [36.65, 10.59],

                image:
                    "https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=900&q=80",

                description:
                    "Une ville du Cap Bon connue notamment pour son activité agricole et sa production d'agrumes.",

                link:
                    "https://fr.wikipedia.org/wiki/B%C3%A9ni_Khalled"
            }

        ];


        // =========================
        // CRÉATION DES MARQUEURS
        // =========================

        places.forEach(place => {

            const marker = L.marker(place.coordinates)
                .addTo(map);


            // Contenu de la popup

            const popupContent = `

                <div class="popup">

                    <img
                        src="${place.image}"
                        alt="${place.name}"
                    >

                    <div class="popup-content">

                        <h3>
                            ${place.name}
                        </h3>

                        <p>
                            ${place.description}
                        </p>

                        <a
                            href="${place.link}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="more-btn"
                        >
                            En savoir plus
                        </a>

                    </div>

                </div>

            `;


            marker.bindPopup(popupContent);

        });


        // =========================
        // CADRAGE AUTOMATIQUE
        // =========================

        const bounds = L.latLngBounds(
            places.map(place => place.coordinates)
        );

        map.fitBounds(bounds, {
            padding: [60, 60]
        });

    </script>

</body>

</html>
